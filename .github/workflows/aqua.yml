name: Aqua module
on:
  pull_request:
    paths:
      - "integrations/aqua/**"
      - "docs/1inch/**"
      - ".github/workflows/aqua.yml"
      - "scripts/lib/aqua-artifacts.ts"
      - "scripts/check-aqua-artifacts.ts"
      - "public/aqua/*artifact.json"
  push:
    branches: [main]
    paths:
      - "integrations/aqua/**"
      - "docs/1inch/**"
      - ".github/workflows/aqua.yml"
      - "scripts/lib/aqua-artifacts.ts"
      - "scripts/check-aqua-artifacts.ts"
      - "public/aqua/*artifact.json"
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run --workspace @noria/aqua check
      - run: npm run --workspace @noria/aqua example:plan
  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/aqua/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0
      - run: forge test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: .
      - run: npm run aqua:artifacts
        working-directory: .
