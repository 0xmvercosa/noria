name: Aqua module
on:
  pull_request:
    paths:
      - "integrations/aqua/**"
      - "docs/1inch/**"
      - ".github/workflows/aqua.yml"
  push:
    branches: [main]
    paths:
      - "integrations/aqua/**"
      - "docs/1inch/**"
      - ".github/workflows/aqua.yml"
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/aqua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm example:plan
  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/aqua/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0
      - run: forge test
